services:
  - type: web
    name: ai-learning-week6-rag-langchain
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    plan: free
    healthCheckPath: /api/health
    startCommand: "python -m src.web --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0


      - key: RAG_ALLOWED_ORIGIN
        value: https://wushenghao666.github.io
